# Linux zip of the Rust client (spikes/tauri-fairplay) for its rust-v<version>
# release; Windows and macOS zips come from release.ps1 / release.sh.
name: Rust client Linux

on:
    release:
        types: [published]
    push:
        branches: [rust-client]
        paths: [.github/workflows/rust-linux.yml]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    linux:
        if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'rust-v')
        # oldest runner with WebKitGTK 4.1: older glibc, runs on more distros
        runs-on: ubuntu-22.04
        defaults:
            run:
                working-directory: spikes/tauri-fairplay
        env:
            GH_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/checkout@v4
            - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libgstreamer1.0-dev libayatana-appindicator3-dev
            - run: rustup update stable --no-self-update
            - run: cargo build --release --locked
            - name: Upload to the release
              run: |
                  version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
                  zip=soundcloud-rust-$version-linux-x86_64.zip
                  zip -j "$zip" target/release/fairplay-spike
                  # the release is made by release.ps1 / release.sh; none yet, nothing to add to
                  gh release view "rust-v$version" >/dev/null 2>&1 || { echo "no release rust-v$version"; exit 0; }
                  gh release upload "rust-v$version" "$zip" --clobber
