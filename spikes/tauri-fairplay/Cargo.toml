[package]
name = "fairplay-spike"
version = "0.1.0"
edition = "2024"

[dependencies]
tao = "0.37.2"
wry = { version = "0.57.1", features = ["devtools"] }
serde_json = "1.0.154"
ureq = "3.5.2"
md5 = "0.8.1"
tray-icon = "0.26.1"
png = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
# Same versions as wry, for the content-blocker API it doesn't wrap.
block2 = "0.6"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSError", "NSURL", "NSData", "NSDictionary"] }
objc2-web-kit = { version = "0.3.2", features = ["WKWebView", "WKWebViewConfiguration", "WKUserContentController", "WKContentRuleList", "WKContentRuleListStore", "WKNavigation", "WKSnapshotConfiguration", "objc2-app-kit", "block2"] }
objc2-app-kit = { version = "0.3.2", features = ["NSImage", "NSBitmapImageRep", "NSImageRep", "NSApplication", "NSResponder"] }
muda = "0.21.2"
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Same versions as wry, for the WebView2 APIs it doesn't wrap.
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Same versions as wry, for the GTK container and WebKitGTK's content filters.
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }
webkit2gtk-sys = { version = "2.0", features = ["v2_40"] }
# fds 3 and 4 for the browser's DevTools pipe (browser.rs)
libc = "0.2"
# PNGs of the page for the SNAP test command
cairo-rs = { version = "0.18", features = ["png"] }
glib-sys = "0.18"
gio-sys = "0.18"
gobject-sys = "0.18"
# Secret Service (GNOME Keyring / KWallet); libdbus built in, so no dbus-devel needed.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
gstreamer = "0.25.4"
